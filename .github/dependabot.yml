version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
  # Digest-pinned Dockerfile base images (09 section 8). Options:
  # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    # minio.Dockerfile is rebuilt by hand with the MinIO image (docs/04-operations.md).
    exclude-paths:
      - minio.Dockerfile
    # Patch and digest updates only; a minor or major tag bump is a manual change.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  # Python pins in uv.lock (09 section 8).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    # Transitive pins too: most vulnerable packages in a weekly audit failure are not declared in pyproject.toml.
    allow:
      - dependency-type: all
    # Lock-only bumps; the >= floors in pyproject.toml are never edited.
    versioning-strategy: lockfile-only
    # Minor and patch updates arrive as one PR; a major update is its own PR per package (not ignored).
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
