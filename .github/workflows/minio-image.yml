name: minio-image

# Manual only: PR and nightly runs never build MinIO. See #52.
on: workflow_dispatch

permissions:
  contents: read
  packages: write

concurrency: minio-image

env:
  IMAGE: ghcr.io/mycookie/minio:RELEASE.2025-04-22T22-12-26Z

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: MyCookie/minio
          ref: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
          path: minio-src
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: minio-src
          file: docker/minio.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}
      - name: Summary and multi-arch check
        run: |
          docker buildx imagetools inspect "$IMAGE" | tee inspect.txt
          {
            echo "### $IMAGE"
            echo "Index digest: \`${{ steps.build.outputs.digest }}\`"
            echo '```'
            cat inspect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q 'linux/amd64' inspect.txt
          grep -q 'linux/arm64' inspect.txt
