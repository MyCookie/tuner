name: minio-image

# Manual only: PR and nightly runs never build MinIO. See #52.
on: workflow_dispatch

concurrency: minio-image

env:
  # Single source of the pin; INF-U-008 checks IMAGE's tag is `RELEASE.` + VERSION with `:` replaced by `-`,
  # then `-hardened-` and the run id, so every build gets a tag that is never reused (the guard below refuses an existing one).
  VERSION: "2025-04-22T22:12:26Z"
  COMMIT: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
  IMAGE: ghcr.io/mycookie/minio:RELEASE.2025-04-22T22-12-26Z-hardened-${{ github.run_id }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: MyCookie/minio
          ref: ${{ env.COMMIT }}
          path: minio-src
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag
        run: |
          # Fail closed: only a registry "not found" lets the build go on; any other error stops it.
          if out=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE already exists; refusing to re-push a published tag"
            exit 1
          elif ! grep -qiE 'not found|manifest unknown|name unknown' <<<"$out"; then
            echo "$out"
            exit 1
          fi
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: minio-src
          file: docker/minio.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
          tags: ${{ env.IMAGE }}
      - name: Summary and multi-arch check
        run: |
          docker buildx imagetools inspect "$IMAGE" | tee inspect.txt
          {
            echo "### $IMAGE"
            echo "Index digest: \`${{ steps.build.outputs.digest }}\`"
            echo '```'
            cat inspect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q 'linux/amd64' inspect.txt
          grep -q 'linux/arm64' inspect.txt

  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # No checkout, so no contents. The package is not known to be public (its visibility is set on
    # GHCR, not by the repo being public), so log in with the job token, which needs packages: read.
    permissions:
      packages: read
    env:
      PLATFORM: ${{ matrix.platform }}
      # The index digest publish just pushed, not the mutable tag.
      REF: ghcr.io/mycookie/minio@${{ needs.publish.outputs.digest }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published digest for this platform
        run: docker pull --platform "$PLATFORM" "$REF"
      - name: Architecture matches the matrix platform
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' "$REF")
          echo "image architecture: $arch (want ${PLATFORM#linux/})"
          test "$arch" = "${PLATFORM#linux/}"
      - name: Start like compose and wait for /minio/health/live
        run: |
          # Dummy literals: an ephemeral CI container, nothing here is a secret.
          docker run -d --name minio-smoke --platform "$PLATFORM" -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=smoke-user -e MINIO_ROOT_PASSWORD=smoke-password-1234 \
            "$REF" server /data --console-address :9001
          for _ in $(seq 30); do
            curl -fs --max-time 5 http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "::error::minio did not answer /minio/health/live within 60 s"
          docker ps -a
          docker logs minio-smoke
          exit 1
