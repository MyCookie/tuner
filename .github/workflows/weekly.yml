name: weekly

# Dependency audit (06-testing.md §6, point 3): on every lockfile change, and weekly
# on schedule regardless -- a dependency can turn out vulnerable long after the PR
# that pinned it merged.
on:
  push:
    branches: ["**"]
    paths:
      - "uv.lock"
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.11"

      - name: uv export (full dependency set, including extras)
        run: uv export --extra dev --extra train --no-hashes -o requirements-audit.txt

      - name: pip-audit
        # SUPPRESSION: PYSEC-2026-3804 (accelerate <=1.14.0, path traversal + DoS in
        # load_checkpoint_in_model / load_checkpoint_and_dispatch). No upstream fix
        # release exists (advisory marks accelerate affected *through* 1.14.0, the
        # current release -- a bump cannot resolve it). Not reachable in Tuner: those
        # functions are never called, and every checkpoint we load is either a pinned
        # upstream repo@revision or Tuner's own SafeTensors output -- never an
        # attacker-influenced weight_map. Full exposure analysis + revisit trigger:
        # tracking Issue #48. Remove this ignore when accelerate
        # ships a fixed release.
        run: uvx pip-audit -r requirements-audit.txt --ignore-vuln PYSEC-2026-3804
