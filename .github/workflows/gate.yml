name: gate

# The single required PR check: the teamflow ruleset requires the context `gate`, which
# comes from this job's id (so the job must not get a different `name:`). The job only
# stands up the environment (toolchain, a throwaway .env, the compose stack) and runs
# ./scripts/gate.sh, the one definition of green (docs/spec/10-code-review.md §4); every
# check lives there. GH Actions' native `services:` key needs a pre-built registry
# image, which this repo doesn't publish -- `docker compose up` as a regular step
# instead, the same stack a human starts locally (docs/spec/09-git-workflow.md §4).
on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # 30, down from 45 (#120). Normal runs take 6-10 min. The slow runs (about 37 min of
    # pytest) were dominated by three CPU-training tests: CLI-I-014's real mini-run
    # (~18 min, now in the nightly lane), test_trainer.py (~15 min) and test_smoke.py
    # (~3 min). Without CLI-I-014 a slow run is roughly 22 min, so 30 keeps ~8 min of
    # margin and a hung run is cancelled sooner than at 45.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: gate.sh's branch-history secret scan refuses a shallow clone

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"

      - name: Install toolchain
        run: uv sync --extra dev --extra train

      - name: Write .env
        run: ./scripts/write_ci_env.sh

      - name: Start compose services
        run: docker compose --profile e2e up -d minio minio-init mlflow mock-judge

      - name: Wait for services to be healthy
        run: |
          for svc in minio mlflow mock-judge; do
            for _ in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "tuner-${svc}-1" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "::error::$svc never became healthy"; docker compose logs "$svc"; exit 1; }
          done

      - name: Gate
        run: ./scripts/gate.sh

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down compose services
        if: always()
        run: docker compose --profile e2e down -v
