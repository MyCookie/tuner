name: nightly

# Nightly lane (06-testing.md §6, point 4): pytest -m slow (INF-S cases -- container
# structure, scale smoke) + the CPU E2E steel thread. GPU E2E is never run in CI --
# it's the manual release gate (06 §6 point 5; 09-git-workflow.md §5).
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.11"

      - name: Install toolchain
        run: uv sync --extra dev --extra train

      - name: Write .env
        run: ./scripts/write_ci_env.sh

      - name: Start compose services
        run: docker compose --profile e2e up -d minio minio-init mlflow mock-judge

      - name: Wait for services to be healthy
        run: |
          for svc in minio mlflow mock-judge; do
            for _ in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "tuner-${svc}-1" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "::error::$svc never became healthy"; docker compose logs "$svc"; exit 1; }
          done

      - name: Warm up mock-judge's actual scoring path
        # The healthcheck above only proves mock-judge's own GET /docs responds --
        # not the POST /v1/chat/completions path the Judge stage will hammer
        # repeatedly (tests/mock_judge/app.py). A container can report "healthy" while
        # its actual scoring path is still cold, silently eating the pipeline's first
        # several requests (issue #20's leading hypothesis for the nightly timeout).
        # One real round-trip against that exact endpoint, with a minimal
        # OpenAI-chat-shaped body matching what chat_completions() expects
        # (payload["messages"], each with "content"; no marker -> default score, 200).
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8088/v1/chat/completions \
              -H 'Content-Type: application/json' \
              -d '{"messages": [{"role": "user", "content": "warmup"}], "model": "mock-judge"}')
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "::error::mock-judge's /v1/chat/completions never returned 200 (last: $code)"; docker compose logs mock-judge; exit 1; }

      - name: Slow lane (INF-S cases)
        # INF-S-020/021 landed in T15 (docs/spec/07-build-plan.md) -- `-m slow` now
        # selects real tests (tests/slow/test_containers.py, test_scale.py), so this
        # must fail on any nonzero exit, including pytest's "no tests collected" (5):
        # a renamed directory, a marker typo, or a conftest import error at the wrong
        # level would otherwise silently pass this job.
        run: |
          set -a; . ./.env; set +a
          uv run pytest -m slow

      - name: Seed the tiny-test HF cache
        # Secondary hardening, not the fix for the timeout above (live verification
        # on this branch found the real bottleneck was CPU training-step throughput,
        # not a cold download -- see the e2e_run fixture's own timeout comment). Still
        # a real gap worth closing on its own merits: without this, the E2E
        # subprocess below does an unauthenticated, unbounded live-network HF Hub
        # download of tiny-test's weights on every nightly run, same as pr.yml's own
        # "Seed the tiny-test HF cache" step already does for the PR lane (INF-I-012).
        run: uv run python scripts/seed_hf_cache.py

      - name: CPU E2E steel thread
        # HF_HUB_OFFLINE=1 scoped to this one step, not blanket for the whole job:
        # the seed step above needs real network and must run before this var is
        # set (mirrors pr.yml's own comment on why its analogous var is scoped this
        # narrowly -- huggingface_hub reads it at process start, so setting it any
        # earlier would break the seed step's own download).
        run: |
          set -a; . ./.env; set +a
          export HF_HUB_OFFLINE=1
          uv run pytest -m e2e tests/e2e/test_steel_thread.py -v

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down compose services
        if: always()
        run: docker compose --profile e2e down -v
