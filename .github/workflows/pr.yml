name: pr

# Every PR (06-testing.md §6, point 2): integration tests with MinIO/MLflow/mock-judge
# as service containers, HF access in offline mode against a pre-seeded tiny-model
# cache (INF-I-012), the per-module coverage gate. GH Actions' native `services:` key
# needs a pre-built registry image, which this repo doesn't publish -- `docker
# compose up` as a regular step instead, the same command a human runs locally
# (docs/09-git-workflow.md §4/10-code-review.md §3-4's "one script, can't drift").
on:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"

      - name: Install toolchain
        run: uv sync --extra dev --extra train

      # Throwaway, ephemeral, single-CI-run-only credentials for this job's own
      # disposable MinIO instance -- not real secrets (CLAUDE.md hard rule 3 is about
      # never committing *production* credentials; nothing here outlives this job).
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=ci-minio-root
          MINIO_ROOT_PASSWORD=ci-minio-root-password
          INGESTOR_S3_ACCESS_KEY=ci-minio-root
          INGESTOR_S3_SECRET_KEY=ci-minio-root-password
          CLEANER_S3_ACCESS_KEY=ci-minio-root
          CLEANER_S3_SECRET_KEY=ci-minio-root-password
          JUDGE_S3_ACCESS_KEY=ci-minio-root
          JUDGE_S3_SECRET_KEY=ci-minio-root-password
          TOKENIZER_S3_ACCESS_KEY=ci-minio-root
          TOKENIZER_S3_SECRET_KEY=ci-minio-root-password
          TRAINER_S3_ACCESS_KEY=ci-minio-root
          TRAINER_S3_SECRET_KEY=ci-minio-root-password
          SMOKE_S3_ACCESS_KEY=ci-minio-root
          SMOKE_S3_SECRET_KEY=ci-minio-root-password
          REGISTRY_OPS_S3_ACCESS_KEY=ci-minio-root
          REGISTRY_OPS_S3_SECRET_KEY=ci-minio-root-password
          MLFLOW_S3_ACCESS_KEY=ci-minio-root
          MLFLOW_S3_SECRET_KEY=ci-minio-root-password
          TUNER_S3_ENDPOINT=http://localhost:9000
          TUNER_S3_ACCESS_KEY=ci-minio-root
          TUNER_S3_SECRET_KEY=ci-minio-root-password
          TUNER_S3_REGION=us-east-1
          MLFLOW_TRACKING_URI=http://localhost:5000
          TUNER_JUDGE_BASE_URL=http://localhost:8088
          TUNER_JUDGE_API_KEY=ci-unused-mock-key
          HF_TOKEN=ci-unused-tiny-test-is-ungated
          EOF
          # Every per-stage credential pair is the same MinIO root user here (unlike
          # real deployments' distinct per-stage principals, 05-infrastructure.md §5)
          # -- simplest correct thing for a single disposable CI instance; the real
          # IAM matrix itself is proven by INF-I-003 in this same job, run against
          # bootstrap_minio.py's own distinct per-stage users regardless of what this
          # .env's *unused-by-that-test* per-stage vars say.

      - name: Start compose services
        run: docker compose --profile e2e up -d minio minio-init mlflow mock-judge

      - name: Wait for services to be healthy
        run: |
          for svc in minio mlflow mock-judge; do
            for _ in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "tuner-${svc}-1" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "::error::$svc never became healthy"; docker compose logs "$svc"; exit 1; }
          done

      - name: Seed the tiny-test HF cache (network on, before offline mode)
        run: uv run python scripts/seed_hf_cache.py

      - name: Unit + integration tests (offline HF mode, coverage)
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          set -a; . ./.env; set +a
          uv run pytest -m 'not e2e and not gpu and not slow' \
            --cov=src/tuner --cov-report=term-missing --cov-report=json

      - name: Per-module coverage gate
        run: uv run python scripts/check_coverage.py

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down compose services
        if: always()
        run: docker compose --profile e2e down -v
