name: pr

# Every PR (06-testing.md §6, point 2): integration tests with MinIO/MLflow/mock-judge
# as service containers, HF access in offline mode against a pre-seeded tiny-model
# cache (INF-I-012), the per-module coverage gate. GH Actions' native `services:` key
# needs a pre-built registry image, which this repo doesn't publish -- `docker
# compose up` as a regular step instead, the same command a human runs locally
# (docs/09-git-workflow.md §4/10-code-review.md §3-4's "one script, can't drift").
on:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"

      - name: Install toolchain
        run: uv sync --extra dev --extra train

      - name: Write .env
        run: ./scripts/write_ci_env.sh

      - name: Start compose services
        run: docker compose --profile e2e up -d minio minio-init mlflow mock-judge

      - name: Wait for services to be healthy
        run: |
          for svc in minio mlflow mock-judge; do
            for _ in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "tuner-${svc}-1" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "::error::$svc never became healthy"; docker compose logs "$svc"; exit 1; }
          done

      - name: Seed the tiny-test HF cache (network on, before offline mode)
        run: uv run python scripts/seed_hf_cache.py

      - name: Unit + integration tests (offline HF mode, coverage)
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          set -a; . ./.env; set +a
          uv run pytest -m 'not e2e and not gpu and not slow' \
            --cov=src/tuner --cov-report=term-missing --cov-report=json

      - name: Per-module coverage gate
        run: uv run python scripts/check_coverage.py

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down compose services
        if: always()
        run: docker compose --profile e2e down -v
