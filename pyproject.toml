[project]
name = "eftp"
version = "0.1.0"
description = "Enterprise Fine-Tuning Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "click>=8.1",
  "mlflow>=2.12",
  "transformers>=4.41",
  "safetensors>=0.4",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "peft>=0.11",
  "bitsandbytes>=0.43",
  "accelerate>=0.30",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
]

[project.scripts]
eftp = "eftp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eftp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
  "integration: requires docker compose services (MinIO, MLflow)",
  "e2e: full pipeline steel-thread test",
  "gpu: requires a CUDA device; skipped in CI, run manually in T15",
  "slow: nightly-lane only",
]
addopts = "-m 'not integration and not e2e and not gpu and not slow'"

[tool.coverage.run]
branch = true
source = ["src/eftp"]

[tool.coverage.report]
fail_under = 90
exclude_also = [
  "if __name__ == .__main__.:",
]
