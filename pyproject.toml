[project]
name = "tuner"
version = "0.1.0"
description = "Enterprise Fine-Tuning Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "click>=8.1",
  "mlflow>=2.12",
  "transformers>=4.41",
  "safetensors>=0.4",
  "minio>=7.2.20",
  "httpx>=0.27",  # tuner.judge.client — the OpenAI-compatible judge HTTP calls
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "peft>=0.11",
  "bitsandbytes>=0.43",
  "accelerate>=0.30",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "fastapi>=0.111",   # tests/mock_judge/app.py (httpx is now a main dependency)
]

[project.scripts]
tuner = "tuner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests/integration/test_infra.py can `import scripts.bootstrap_minio`
markers = [
  "integration: requires docker compose services (MinIO, MLflow)",
  "e2e: full pipeline steel-thread test",
  "gpu: requires a CUDA device; skipped in CI, run manually in T15",
  "slow: nightly-lane only",
]
addopts = "-m 'not integration and not e2e and not gpu and not slow'"
filterwarnings = [
  # fastapi.testclient wraps starlette's; both warn on import about a future
  # httpx replacement package that doesn't affect behavior. Not a subclass of
  # DeprecationWarning despite the name — it's a plain UserWarning subclass.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
  # mlflow's own file-store internals use the stdlib's deprecated codecs.open();
  # nothing tuner's code does, and not ours to fix.
  "ignore:codecs.open\\(\\) is deprecated. Use open\\(\\) instead.:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/tuner"]

[tool.coverage.report]
fail_under = 90
exclude_also = [
  "if __name__ == .__main__.:",
]
